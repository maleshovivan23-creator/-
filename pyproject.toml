[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ultranet"
version = "1.0.0"
description = "Ультимативная нейросетевая библиотека на чистом NumPy: автоград, слои, оптимизаторы, GPT"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["ultranet*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
