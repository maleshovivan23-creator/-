name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  fast:
    name: Быстрые тесты (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Установка
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest
      - name: Тесты
        run: pytest -q --maxfail=1 --durations=10 -m "not slow"

  slow:
    name: Медленные тесты
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Установка
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest
      - name: Тесты
        run: pytest -q --durations=10 -m "slow"
